# Build the static site on the homelab1 self-hosted runner and serve it
# from Docker on host port 7200.

name: Deploy to homelab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start on port 7200
        run: docker compose up -d --build

      - name: Check the site responds
        run: curl -fsS -o /dev/null http://127.0.0.1:7200/
